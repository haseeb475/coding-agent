# Tool configuration only; the project is run from a source checkout
# (see README), not installed as a package.

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["ui/frontend", "workspace", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501: long prompt strings and tool schemas are kept on one line on purpose.
# E701/E702: compact one-line helpers in the CLI.
ignore = ["E501", "E701", "E702"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "evaluation", "execution", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
